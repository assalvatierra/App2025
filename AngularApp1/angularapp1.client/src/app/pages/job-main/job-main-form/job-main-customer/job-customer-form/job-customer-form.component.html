<div class="job-customer-form-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEditMode ? 'Edit' : 'Add' }} Job Customer</h2>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <mat-form-field class="full-width">
          <mat-label>Customer</mat-label>
          <mat-select formControlName="customerId">
            <mat-option value="">-- Select Customer --</mat-option>
            <mat-option *ngFor="let customer of customers" [value]="customer.id">
              {{ customer.name }} (ID: {{ customer.id }})
            </mat-option>
          </mat-select>
          <mat-error *ngIf="customerForm.get('customerId')?.hasError('required')">
            Customer is <strong>required</strong>
          </mat-error>
        </mat-form-field>
      </div>

      <div *ngIf="loadingCustomers" class="loading-message">
        <mat-spinner diameter="20" style="margin-right: 8px;"></mat-spinner>
        Loading customers...
      </div>

      <div class="form-group">
        <mat-form-field class="full-width">
          <mat-label>Job Main ID</mat-label>
          <input matInput type="number" formControlName="jobMainId" placeholder="Job ID" [disabled]="true">
        </mat-form-field>
      </div>

      <div class="checkbox-group">
        <mat-checkbox formControlName="isPrimary">Is Primary Customer</mat-checkbox>
      </div>

      <div class="checkbox-group">
        <mat-checkbox formControlName="isBillTo">Is Bill To</mat-checkbox>
      </div>

      <div class="form-group">
        <mat-form-field class="full-width">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" placeholder="Additional notes..." rows="3"></textarea>
        </mat-form-field>
      </div>
    </form>
  </div>

  <!-- Actions -->
  <div class="dialog-actions">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="customerForm.invalid || isLoading">
      <mat-icon *ngIf="!isLoading">save</mat-icon>
      <mat-spinner diameter="20" *ngIf="isLoading" style="margin-right: 8px;"></mat-spinner>
      {{ isEditMode ? 'Update' : 'Add' }} Customer
    </button>
  </div>
</div>
