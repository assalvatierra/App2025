<div class="job-contact-form-dialog">
  <h2 mat-dialog-title>Add Contact to Job</h2>
  <mat-dialog-content>
    <form [formGroup]="form">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Contact</mat-label>
        <mat-select formControlName="contactId">
          <mat-option *ngFor="let c of contacts" [value]="c.id">{{ c.name }} - {{ c.contactNo1 }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-checkbox formControlName="isPrimary">Primary</mat-checkbox>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Notes</mat-label>
        <input matInput formControlName="notes" />
      </mat-form-field>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="isLoading">Save</button>
  </mat-dialog-actions>
</div>
