<ui-page-title [title]="'Resources'"></ui-page-title>

<mat-card class="filter-card">
  <mat-card-header>
    <mat-card-title>Filter Resources</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-container">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Code</mat-label>
        <input matInput [(ngModel)]="filterCode" placeholder="Enter resource code">
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="filterName" placeholder="Enter resource name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Type</mat-label>
        <mat-select [(ngModel)]="filterItemTypeId">
          <mat-option [value]="undefined">All</mat-option>
          <mat-option *ngFor="let type of itemTypes" [value]="type.id">
            {{ type.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="filter-buttons">
        <button mat-raised-button color="primary" (click)="onFilter()">
          Apply Filter
        </button>
        <button mat-raised-button (click)="onClearFilter()">
          Clear Filter
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <app-entity-list-table
      #ListTable
      [tableFields]="tableFields"
      [showEdit]="showEdit"
      [showAdd]="true"
      [addTitle]="'Add Resource'"
      [editTitle]="'Edit Resource'"
      (addRecordClicked)="onAddRecord()"
      (editRecordClicked)="onEdit($event)"
      (archiveClicked)="onArchive($event)"
    ></app-entity-list-table>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <div class="spinner">Loading...</div>
</div>
