<mat-card>
  <mat-card-header>
    <div>
      <mat-card-title>{{ isEditMode ? 'Edit' : 'Create' }} Job Service</mat-card-title>
    </div>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="jobServiceForm" novalidate>
      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>Job Service Details</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Job Main ID</mat-label>
                <input matInput type="number" formControlName="jobMainId" placeholder="Enter Job Main ID...">
                <mat-error *ngIf="jobServiceForm.get('jobMainId')?.hasError('required') && jobServiceForm.get('jobMainId')?.touched">
                  Job Main ID is <strong>required</strong>
                </mat-error>
              </mat-form-field>
            </div>
          </div>


          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Date Start</mat-label>
                <input matInput type="date" formControlName="dateStart">
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Date End</mat-label>
                <input matInput type="date" formControlName="dateEnd" />
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>
                  Particulars
                </mat-label>
                <textarea matInput rows="3" formControlName="particulars" placeholder="Service Description..."></textarea>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Quote amount</mat-label>
                <input matInput type="number" formControlName="quotedAmt" placeholder="0" />
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Item Status</mat-label>
                <mat-select formControlName="itemStatusId">
                  <mat-option *ngFor="let status of itemStatuses" [value]="status.id">
                    {{ status.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

        </mat-card-content>
      </mat-card>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!jobServiceForm.valid">
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <button mat-raised-button (click)="router.navigate(['/job-service'])">
      <mat-icon>cancel</mat-icon>
      Cancel
    </button>
  </mat-card-actions>
</mat-card>
