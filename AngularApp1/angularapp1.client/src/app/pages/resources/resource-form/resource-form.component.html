<ui-page-title [title]="titleInfo"></ui-page-title>

<mat-card>
  <mat-card-header>
    <mat-card-title>{{ titleInfo }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="resourceForm" (ngSubmit)="onSubmit()">
      <div class="form-container">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required>
          <mat-error *ngIf="resourceForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Code</mat-label>
          <input matInput formControlName="code" required>
          <mat-error *ngIf="resourceForm.get('code')?.hasError('required')">
            Code is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <input matInput formControlName="description">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" rows="3"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Type</mat-label>
          <mat-select formControlName="itemTypeId">
            <mat-option [value]="null">None</mat-option>
            <mat-option *ngFor="let type of itemTypes" [value]="type.id">
              {{ type.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="itemStatusId">
            <mat-option *ngFor="let status of itemStatuses" [value]="status.id">
              {{ status.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Sort Order</mat-label>
          <input matInput type="number" formControlName="sortOrder">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>JSON Properties (Optional)</mat-label>
          <textarea matInput formControlName="jsonProperties" rows="3" placeholder='{"key": "value"}'></textarea>
        </mat-form-field>

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" *ngIf="!showAddBtn" [disabled]="dataloading">
            Update Resource
          </button>
          <button mat-raised-button color="primary" type="button" (click)="onAdd()" *ngIf="showAddBtn" [disabled]="dataloading">
            Add Resource
          </button>
          <button mat-raised-button type="button" (click)="onCancel()" [disabled]="dataloading">
            Cancel
          </button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <div class="spinner">Loading...</div>
</div>
