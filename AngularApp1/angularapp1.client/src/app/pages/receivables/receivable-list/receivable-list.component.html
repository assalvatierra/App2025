<ui-page-title [title]="'Receivables'"></ui-page-title>

<mat-card class="filter-card">
  <mat-card-header>
    <mat-card-title>Filter Receivables</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-container">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Reference</mat-label>
        <input matInput [(ngModel)]="filterName" placeholder="Enter transaction reference">
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Entity</mat-label>
        <mat-select [(ngModel)]="filterEntityId">
          <mat-option [value]="undefined">All</mat-option>
          <mat-option *ngFor="let entity of entities" [value]="entity.id">
            {{ entity.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filterIsActive">
          <mat-option [value]="null">All</mat-option>
          <mat-option [value]="true">Active</mat-option>
          <mat-option [value]="false">Inactive</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="filter-buttons">
        <button mat-raised-button color="primary" (click)="onFilter()">
          Apply Filter
        </button>
        <button mat-raised-button (click)="onClearFilter()">
          Clear Filter
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <app-entity-list-table
      #ListTable
      [tableFields]="tableFields"
      [showEdit]="showEdit"
      [showAdd]="true"
      [addTitle]="'Add Receivable'"
      [editTitle]="'Edit Receivable'"
      (addRecordClicked)="onAddRecord()"
      (editRecordClicked)="onEdit($event)"
      (deleteRecordClicked)="onDelete($event)"
      (archiveRecordClicked)="onArchive($event)"
      (activateRecordClicked)="onActivate($event)">
    </app-entity-list-table>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <mat-spinner></mat-spinner>
</div>
