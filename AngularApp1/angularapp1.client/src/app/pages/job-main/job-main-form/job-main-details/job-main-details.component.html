<mat-card>
  <mat-card-content>
    <form [formGroup]="jobMainForm" *ngIf="!dataloading" novalidate>
      <mat-card class="form-card">

        <mat-card-content>
          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Job Date</mat-label>
                <input matInput type="date" formControlName="jobDate">
                <mat-error *ngIf="jobMainForm.get('jobDate')?.hasError('required') && jobMainForm.get('jobDate')?.touched">
                  Job Date is <strong>required</strong>
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Description</mat-label>
                <textarea matInput rows="3" formControlName="description" placeholder="Enter job description..."></textarea>
                <mat-error *ngIf="jobMainForm.get('description')?.hasError('required') && jobMainForm.get('description')?.touched">
                  Description is <strong>required</strong>
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Item Status</mat-label>
                <mat-select formControlName="itemStatusId">
                  <mat-option *ngFor="let st of itemStatusLookupData" [value]="st.id">
                    {{ st.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Business Unit</mat-label>
                <mat-select formControlName="businessUnitId">
                  <mat-option *ngFor="let bu of businessUnitLookupData" [value]="bu.id">
                    {{ bu.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Created By</mat-label>
                <input matInput formControlName="createdBy" placeholder="Enter creator name...">
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Last Edit By</mat-label>
                <input matInput formControlName="lastEditBy" placeholder="Enter editor name...">
              </mat-form-field>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <div *ngIf="!ShowAddBtn">
      <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="dataloading">
        <mat-icon>save</mat-icon>
        Update
      </button>
    </div>

    <div *ngIf="ShowAddBtn">
      <button mat-raised-button color="primary" (click)="onAdd()" [disabled]="dataloading">
        <mat-icon>add</mat-icon>
        Add Job
      </button>
    </div>

    <button mat-raised-button (click)="onCancel()" [disabled]="dataloading">
      <mat-icon>cancel</mat-icon>
      Cancel
    </button>

    <button mat-raised-button color="accent" (click)="onGetReport()" [disabled]="dataloading || reportLoading">
      <mat-icon>assessment</mat-icon>
      {{ reportLoading ? 'Loading...' : 'Report' }}
    </button>
  </mat-card-actions>

  <div *ngIf="pdfUrl" style="margin-top: 16px; padding: 0 16px 16px;">
    <iframe [src]="pdfUrl" width="100%" height="800px" style="border: 1px solid #ccc;"></iframe>
  </div>
</mat-card>
