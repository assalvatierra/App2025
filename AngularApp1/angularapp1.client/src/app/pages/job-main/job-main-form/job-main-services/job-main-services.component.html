<mat-card>
  <mat-card-header>
    <mat-card-title>
      Services
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-entity-list-table #ListTable
                           (addRecordClicked)="onAddRecord()"
                           [editTitle]="'Edit Service'"
                           [showEditDetails]="false"
                           (editRecordClicked)="onEdit($event)"
                           [tableFields]="tableFields">
    </app-entity-list-table>
  </mat-card-content>
</mat-card>
