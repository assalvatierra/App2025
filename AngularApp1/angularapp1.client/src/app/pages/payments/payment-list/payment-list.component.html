<ui-page-title [title]="'Payments'"></ui-page-title>

<mat-card class="filter-card">
  <mat-card-header>
    <mat-card-title>Filter Payments</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-container">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Remarks</mat-label>
        <input matInput [(ngModel)]="filterRemarks" placeholder="Search by remarks">
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filterItemStatusId">
          <mat-option [value]="null">All</mat-option>
          <mat-option *ngFor="let status of itemStatuses" [value]="status.id">
            {{ status.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="filter-buttons">
        <button mat-raised-button color="primary" (click)="onFilter()">
          Apply Filter
        </button>
        <button mat-raised-button (click)="onClearFilter()">
          Clear Filter
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <app-entity-list-table
      #ListTable
      [tableFields]="tableFields"
      [showEdit]="showEdit"
      [showAdd]="true"
      [addTitle]="'Add Payment'"
      [editTitle]="'Edit Payment'"
      (addRecordClicked)="onAddRecord()"
      (editRecordClicked)="onEdit($event)"
      (deleteRecordClicked)="onDelete($event)">
    </app-entity-list-table>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <mat-spinner></mat-spinner>
</div>
