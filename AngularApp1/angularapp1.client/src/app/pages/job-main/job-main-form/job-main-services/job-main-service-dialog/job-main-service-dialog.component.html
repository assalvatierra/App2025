<mat-card>
  <mat-card-header>
    <div>
      <mat-card-title>{{ isEditMode ? 'Edit' : 'Add' }} Job Service</mat-card-title>
    </div>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="jobServiceForm" novalidate>
      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>Job Service Details</mat-card-title>
        </mat-card-header>
        <mat-card-content>

          <!-- Job Main ID is hidden when editing, shown when adding (but readonly) -->

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Service</mat-label>
                <mat-select formControlName="serviceItemId">
                  <mat-option *ngFor="let item of serviceItems" [value]="item.id">
                    {{ item.description }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Supplier</mat-label>
                <mat-select formControlName="supplierId">
                  <mat-option [value]="null">-- None --</mat-option>
                  <mat-option *ngFor="let supplier of suppliers" [value]="supplier.id">
                    {{ supplier.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Date Start</mat-label>
                <input matInput type="date" formControlName="dateStart">
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Date End</mat-label>
                <input matInput type="date" formControlName="dateEnd" />
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>
                  Particulars
                </mat-label>
                <textarea matInput rows="3" formControlName="particulars" placeholder="Service Description..."></textarea>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Quote amount</mat-label>
                <input matInput type="number" formControlName="quotedAmt" placeholder="0" />
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Supplier Amount</mat-label>
                <input matInput type="number" formControlName="supplierAmt" placeholder="0" />
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Item Status</mat-label>
                <mat-select formControlName="itemStatusId">
                  <mat-option *ngFor="let status of itemStatuses" [value]="status.id">
                    {{ status.description }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Sort Order</mat-label>
                <input matInput type="number" formControlName="sortOrder" placeholder="0" />
              </mat-form-field>
            </div>
          </div>

        </mat-card-content>
      </mat-card>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSaveClick()" [disabled]="!jobServiceForm.valid">
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <button mat-raised-button (click)="onCancelClick()">
      <mat-icon>cancel</mat-icon>
      Cancel
    </button>
  </mat-card-actions>
</mat-card>
