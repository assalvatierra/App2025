<div style="padding: 16px;">
  <h2>Test Report</h2>

  <button mat-raised-button color="primary" (click)="loadReport()" [disabled]="isLoading">
    {{ isLoading ? 'Loading...' : 'Refresh Report' }}
  </button>

  <div *ngIf="errorMessage" style="color: red; margin-top: 12px;">{{ errorMessage }}</div>

  <div *ngIf="pdfUrl" style="margin-top: 16px;">
    <iframe [src]="pdfUrl" width="100%" height="800px" style="border: 1px solid #ccc;"></iframe>
  </div>
</div>
