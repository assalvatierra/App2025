<mat-card>
  <mat-card-header>
    <mat-card-title>{{TitleInfo}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
  

    <form [formGroup]="dataFormName">
      <mat-card class="shipping-card">
        <mat-card-header>
          <mat-card-title>Contact Name</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <mat-form-field class="full-width" style="width: 100%;">
            <input matInput type="text" id="name" formControlName="name" class="form-control" placeholder="Enter Name" required>
          </mat-form-field>
          <div style="display: flex; gap: 16px;">
            <mat-form-field class="full-width" style="flex: 1;">
              <mat-label>Item Type</mat-label>
              <mat-select formControlName="typeId">
                <mat-option *ngFor="let it of itemTypeLookupData" [value]="it.id">
                  {{ it.name }}
                </mat-option>
              </mat-select>
            </mat-form-field>
            
            <mat-form-field class="full-width" style="flex: 1;">
              <mat-label>Status</mat-label>
              <mat-select formControlName="statusId">
                <mat-option *ngFor="let st of itemStatusLookupData" [value]="st.id">
                  {{ st.name }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </mat-card-content>
      </mat-card>
    </form>

    <mat-tab-group>
      <mat-tab label="Information">
        <app-contact-info-form #ContactForm
                               *ngIf="!dataloading"
                               [modelData]="currentData">
        </app-contact-info-form>

      </mat-tab>
    </mat-tab-group>

  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSubmit()">Submit</button>
    <button mat-raised-button color="primary" (click)="onCancel()">Cancel</button>
  </mat-card-actions>
</mat-card>
