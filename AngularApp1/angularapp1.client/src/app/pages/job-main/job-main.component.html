<mat-card>
  <mat-card-header>
    <mat-card-title>
      <ui-page-title [title]="'Job Order List'"></ui-page-title>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap: wrap;">
      <mat-form-field appearance="outline" style="min-width: 280px;">
        <mat-label>Business Unit</mat-label>
        <mat-select [(value)]="selectedBusinessUnitId" (selectionChange)="onFilterChange()">
          <mat-option [value]="0">All</mat-option>
          <mat-option *ngFor="let unit of businessUnits" [value]="unit.id">
            {{ unit.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" style="min-width: 280px; flex: 1;">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="searchText" (input)="onFilterChange()" placeholder="Search by description, ID, or user...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

      <app-entity-list-table #ListTable
                             (addRecordClicked)="onAddRecord()"
                             [editTitle]="'Edit Job'"
                             [showEditDetails]="false"
                             (editRecordClicked)="onEdit($event)"
                             [tableFields]="tableFields">
      </app-entity-list-table>
  </mat-card-content>
</mat-card>
