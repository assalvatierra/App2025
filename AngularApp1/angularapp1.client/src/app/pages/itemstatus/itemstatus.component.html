<mat-card>
  <mat-card-header>
    <mat-card-title>
      <ui-page-title [title]="'Item Status'"></ui-page-title>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
      <mat-form-field appearance="outline" style="min-width: 280px;">
        <mat-label>Item Status Class</mat-label>
        <mat-select [(value)]="selectedItemStatusClassName" (selectionChange)="onItemStatusClassChange()">
          <mat-option [value]="''">All</mat-option>
          <mat-option *ngFor="let statusClass of itemStatusClasses" [value]="statusClass.name">
            {{ statusClass.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <app-entity-list-table #ListTable
            (addRecordClicked)="onAddRecord()"
            [showEdit]="showEdit"
            [showFilter]="true"
            [editTitle]="'Edit ItemStatus'"
            (editRecordClicked)="onEdit($event)"
            (onEditDetails)="onEditDetails($event)"
            (onArchiveRecord)="onArchive($event)"
            [tableFields]="tableFields">
    </app-entity-list-table>
  </mat-card-content>
</mat-card>
