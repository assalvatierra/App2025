<ui-page-title [title]="titleInfo"></ui-page-title>

<mat-card>
  <mat-card-header>
    <mat-card-title>{{ titleInfo }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="timesheetForm" (ngSubmit)="onSubmit()">

      <mat-tab-group animationDuration="200ms">

        <!-- Tab 1: Timesheet Main -->
        <mat-tab label="Timesheet Main">
          <div class="tab-content">
            <app-timesheet-main
              [timesheetForm]="timesheetForm"
              [resourceIdLabel]="resourceIdLabel"
              [resourceId1Label]="resourceId1Label"
              [resourcesForResourceId]="resourcesForResourceId"
              [resourcesForResourceId1]="resourcesForResourceId1"
              [statuses]="statuses"
              [showAddBtn]="showAddBtn"
              [featureLoaded]="featureLoaded"
              [dataloading]="dataloading"
              [jobTimesheets]="jobTimesheets"
              [showJobLinkForm]="showJobLinkForm"
              [jobMains]="jobMains"
              [selectedJobMainId]="selectedJobMainId"
              [jobLinkLoading]="jobLinkLoading"
              [allowMultiJobLink]="allowMultiJobLink"
              (showJobLinkFormRequested)="onShowJobLinkForm()"
              (cancelJobLink)="onCancelJobLink()"
              (linkJob)="onLinkJob()"
              (removeJobLink)="onRemoveJobLink($event)"
              (selectedJobMainIdChange)="selectedJobMainId = $event">
            </app-timesheet-main>
          </div>
        </mat-tab>

        <!-- Tab 2: Expense Details (hidden when allowExtendedDetails is false/null) -->
        <mat-tab *ngIf="allowExtendedDetails" label="Expense Details" [disabled]="showAddBtn">
          <div class="tab-content">
            <app-timesheet-expense-details
              *ngIf="!showAddBtn && !dataloading"
              [timesheetId]="paramId">
            </app-timesheet-expense-details>
            <p *ngIf="showAddBtn" class="tab-disabled-message">
              Save the timesheet first to manage expense details.
            </p>
          </div>
        </mat-tab>

      </mat-tab-group>

      <!-- Form action buttons -->
      <div class="button-container">
        <button mat-raised-button color="primary" type="submit" *ngIf="!showAddBtn" [disabled]="dataloading">
          Update Timesheet
        </button>
        <button mat-raised-button color="primary" type="button" (click)="onAdd()" *ngIf="showAddBtn" [disabled]="dataloading">
          Add Timesheet
        </button>
        <button mat-raised-button color="accent" type="button" (click)="onSubmitForApproval()" *ngIf="!showAddBtn" [disabled]="dataloading">
          Submit for Approval
        </button>
        <button mat-raised-button type="button" (click)="onCancel()" [disabled]="dataloading">
          Cancel
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <div class="spinner">Loading...</div>
</div>
