<div class="mat-elevation-z2" *ngIf="tableFields.length">

  <div class="header-actions">
    <div *ngIf="showAdd" class="add-button">
      <button mat-raised-button color="primary" (click)="onAddRecord()">
        <mat-icon>add</mat-icon>
        {{ addTitle }}
      </button>
    </div>

    <div class="filter-actions">
      <button *ngIf="showFilter" 
              mat-button 
              (click)="toggleBasicFilterPopup()" 
              class="filter-toggle-btn">
        <mat-icon>filter_list</mat-icon>
        Basic Filter
        <span *ngIf="filterValue" class="filter-badge">1</span>
      </button>

      <button *ngIf="showAdvancedFilter" 
              mat-raised-button 
              color="accent"
              (click)="openAdvancedFilterDialog()" 
              class="advanced-filter-btn">
        <mat-icon>tune</mat-icon>
        Advanced Filter
        <span *ngIf="getAdvancedFilterCount() > 0" class="filter-badge">
          {{ getAdvancedFilterCount() }}
        </span>
      </button>

      <button *ngIf="showAdvancedFilter && getAdvancedFilterCount() > 0" 
              mat-icon-button
              matTooltip="Clear advanced filters"
              (click)="clearAdvancedFilters()">
        <mat-icon>clear_all</mat-icon>
      </button>

      <!-- Basic Filter Popup -->
      <div *ngIf="showFilter && filterPopupVisible" class="filter-popup">
        <div class="filter-popup-header">
          <span>Basic Filter</span>
          <button mat-icon-button (click)="closeBasicFilterPopup()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="filter-popup-content">
          <mat-form-field class="filter-field" appearance="outline">
            <mat-label>Search</mat-label>
            <input matInput 
                   [(ngModel)]="filterValue"
                   (keyup)="applyFilter($event)" 
                   placeholder="Search..." 
                   #filterInput>
            <button *ngIf="filterValue" 
                    matSuffix 
                    mat-icon-button 
                    aria-label="Clear" 
                    (click)="clearFilter()">
              <mat-icon>close</mat-icon>
            </button>
            <mat-icon matPrefix>search</mat-icon>
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>

  <table mat-table class="full-width-table" matSort aria-label="Elements" *ngIf="!isLoading">
    <!-- Row Actions -->
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef aria-label="Add Row">
      </th>
      <td mat-cell *matCellDef="let row">
        <app-item-popup-menu [menuLabel]="menuLabel"
                             [showEdit]="showEdit" [editTitle]="editTitle"
                             [showEditDetails]="showEditDetails"
                             (editRecordClicked)="onEditRecord(row.id)"
                             (editDetailClicked)="onEditDetails(row.id)"
                             (archiveClicked)="onArchiveRecord(row.id)">
        </app-item-popup-menu>
      </td>
    </ng-container>
    <ng-container *ngFor="let field of tableFields" [matColumnDef]="field.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ field.label }}
      </th>
      <td mat-cell *matCellDef="let row">
        <ng-container [ngSwitch]="field.type">

          <!-- date -->
          <span *ngSwitchCase="'date'">
            {{ row[field.key] | date:'mediumDate' }}
          </span>

          <!-- currency -->
          <span *ngSwitchCase="'currency'">
            {{ row[field.key] | currency }}
          </span>

          <!-- number -->
          <span *ngSwitchCase="'number'">
            {{ row[field.key] | number }}
          </span>

          <!-- boolean -->
          <mat-icon *ngSwitchCase="'boolean'" [style.color]="row[field.key] ? 'green' : 'gray'">
            {{ row[field.key] ? 'check_circle' : 'cancel' }}
          </mat-icon>

          <!-- badge -->
          <span *ngSwitchCase="'badge'" class="field-badge">
            {{ row[field.key] }}
          </span>

          <!-- progress -->
          <div *ngSwitchCase="'progress'" class="field-progress">
            <mat-progress-bar mode="determinate" [value]="row[field.key]">
            </mat-progress-bar>
            <span class="field-progress-label">{{ row[field.key] }}%</span>
          </div>

          <!-- text (default) -->
          <span *ngSwitchDefault>{{ row[field.key] }}</span>

        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator #paginator
                 [length]="dataSource.data.length"
                 [pageIndex]="0"
                 [pageSize]="10"
                 [pageSizeOptions]="[5, 10, 20]"
                 aria-label="Select page">
  </mat-paginator>

</div>
