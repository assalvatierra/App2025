<ui-page-title [title]="titleInfo"></ui-page-title>

<mat-card>
  <mat-card-header>
    <mat-card-title>{{ titleInfo }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="receivableForm" (ngSubmit)="onSubmit()">
      <div class="form-container">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Transaction Reference *</mat-label>
          <input matInput formControlName="trxRef" required placeholder="Enter transaction reference">
          <mat-error *ngIf="receivableForm.get('trxRef')?.hasError('required')">
            Transaction Reference is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Transaction Date *</mat-label>
          <input matInput type="date" formControlName="trxDate" required>
          <mat-error *ngIf="receivableForm.get('trxDate')?.hasError('required')">
            Transaction Date is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount *</mat-label>
          <input matInput type="number" formControlName="amount" required placeholder="Enter amount">
          <mat-error *ngIf="receivableForm.get('amount')?.hasError('required')">
            Amount is required
          </mat-error>
          <mat-error *ngIf="receivableForm.get('amount')?.hasError('min')">
            Amount must be greater than or equal to 0
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Entity</mat-label>
          <mat-select formControlName="entityId">
            <mat-option [value]="null">Select Entity</mat-option>
            <mat-option *ngFor="let entity of entities" [value]="entity.id">
              {{ entity.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Remarks *</mat-label>
          <textarea matInput formControlName="remarks" rows="3" required placeholder="Enter remarks"></textarea>
          <mat-error *ngIf="receivableForm.get('remarks')?.hasError('required')">
            Remarks is required
          </mat-error>
        </mat-form-field>

        <div class="checkbox-container">
          <label>
            <input type="checkbox" formControlName="isActive">
            Active
          </label>
          <label>
            <input type="checkbox" formControlName="isArchived">
            Archived
          </label>
          <label>
            <input type="checkbox" formControlName="isPrivate">
            Private
          </label>
        </div>

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" [disabled]="dataloading || receivableForm.invalid">
            {{ isNewRecord ? 'Create Receivable' : 'Update Receivable' }}
          </button>
          <button mat-raised-button type="button" (click)="onCancel()" [disabled]="dataloading">
            Cancel
          </button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<div *ngIf="dataloading" class="loading-overlay">
  <mat-spinner></mat-spinner>
</div>
