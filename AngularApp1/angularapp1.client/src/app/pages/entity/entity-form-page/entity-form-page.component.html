<mat-card>
  <mat-card-header>
    <mat-card-title>Entity Info</mat-card-title>
  </mat-card-header>

  <mat-card-content *ngIf="!dataloading">
    <mat-tab-group>
      <!-- Entity Details Tab -->
      <mat-tab label="Entity Details">
        <div class="tab-content">
          <app-entity-form #entityForm
                           [modelData]="currentData">
          </app-entity-form>

          <form [formGroup]="dataForm" novalidate>
            <mat-card>
              <mat-card-content>
                <div class="row">
                  <div class="col">
                    <mat-form-field class="full-width">
                      <mat-label>Entity Type</mat-label>
                      <mat-select formControlName="entityTypeId">
                        <mat-option *ngFor="let it of itemTypeLookupData" [value]="it.id">
                          {{ it.name }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>

                  <div class="col">
                    <mat-form-field class="full-width">
                      <mat-label>Business Unit</mat-label>
                      <mat-select formControlName="businessUnitId">
                        <mat-option *ngFor="let bu of businessUnitLookupData" [value]="bu.id">
                          {{ bu.name }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>

                  <div class="col">
                    <mat-form-field class="full-width">
                      <mat-label>Entity Status</mat-label>
                      <mat-select formControlName="entityStatusId">
                        <mat-option *ngFor="let st of itemStatusLookupData" [value]="st.id">
                          {{ st.name }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>

                <div class="row">
                  <div class="col">
                    <mat-form-field class="full-width">
                      <mat-label>City</mat-label>
                      <mat-select formControlName="refCityId">
                        <mat-option [value]="0">-- None --</mat-option>
                        <mat-option *ngFor="let c of cities" [value]="c.id">{{ c.name }}</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </form>
        </div>
      </mat-tab>

      <!-- Contact Information Tab -->
      <mat-tab label="Contact Information">
        <div class="tab-content">
          <app-contact-info-form #ContactForm
                                 [modelData]="currentData">
          </app-contact-info-form>
        </div>
      </mat-tab>

      <!-- Contacts Tab -->
      <mat-tab label="Contacts" [disabled]="paramId === 0">
        <div class="tab-content">
          <app-entity-contact-list [entityId]="paramId" *ngIf="paramId > 0">
          </app-entity-contact-list>
          <div *ngIf="paramId === 0" class="info-message">
            <mat-icon>info</mat-icon>
            <p>Please save the entity first before adding contacts.</p>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSubmit()">Submit</button>
  </mat-card-actions>
</mat-card>
